<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MERKABA FUSION HD v3</title><style>@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');body{margin:0;background:#020510;color:#fff;font-family:'Orbitron',Arial;overflow:hidden;height:100vh;display:flex;flex-direction:column}.top{padding:10px 14px;display:flex;justify-content:space-between;background:linear-gradient(90deg,#001a33,#002244);border-bottom:2px solid #00e5ff}.top b{font-size:13px;color:#aaffff}.status{background:rgba(0,30,60,0.8);border:1px solid #00e5ff;border-radius:10px;padding:6px;font-size:11px;color:#7effd1;margin-bottom:8px;text-align:center}#game{flex:1;position:relative;background:radial-gradient(#0a1635,#020510)}canvas{width:100%;height:100%;display:block}.hud{position:absolute;bottom:0;left:0;right:0;padding:10px;background:linear-gradient(0deg,rgba(0,0,0,0.95),transparent)}.stats{display:flex;gap:8px;margin-bottom:10px}.stat{flex:1;background:rgba(0,40,80,0.6);border:1px solid;border-radius:10px;padding:8px;text-align:center}.stat:nth-child(1){border-color:#00e5ff;color:#00e5ff}.stat:nth-child(2){border-color:#ffaa00;color:#ffaa00}.stat:nth-child(3){border-color:#88aaff;color:#88aaff}.stat b{font-size:20px;display:block}.btns{display:flex;gap:6px}.btn{flex:1;padding:14px 4px;border-radius:14px;border:2px solid;font-family:'Orbitron';font-size:9px;font-weight:900;cursor:pointer}.b1{background:rgba(0,100,200,0.3);border-color:#00aaff;color:#88ddff}.b2{background:rgba(255,200,0,0.15);border-color:#ffd700;color:#ffef88;animation:pulse 1.2s infinite}.b3{background:rgba(255,100,0,0.25);border-color:#ff8800;color:#ffbb66}@keyframes pulse{0%,100%{box-shadow:0 0 25px gold}50%{box-shadow:0 0 40px gold}}</style></head><body><div class="top"><b>◆ MERKABA • SPLIT RUN FUSION</b><div style="font-size:11px">21:42 • 92%</div></div><div id="game"><canvas id="c" width="400" height="650"></canvas><div class="hud"><div class="status">FUSION FUNCTIONING - ACTIVE 🛡️ • STABLE • 98.4%</div><div class="stats"><div class="stat"><span>LEVEL</span><b>07</b></div><div class="stat"><span>ENERGY</span><b>92%</b></div><div class="stat"><span>SYNC</span><b>87%</b></div></div><div class="btns"><button class="btn b1" onclick="mode='fast'">▶ HORARIO FAST</button><button class="btn b2" onclick="mode='freeze'">❄ FREEZE CRYSTAL</button><button class="btn b3" onclick="mode='rewind'">◀ REWIND</button></div></div></div><script>const cv=document.getElementById('c'),ctx=cv.getContext('2d');let t=0,mode='fusion',particles=[];function draw(){t+=mode=='fast'?0.08:mode=='rewind'?-0.06:0.015;ctx.clearRect(0,0,400,650);let grd=ctx.createRadialGradient(200,280,10,200,280,320);grd.addColorStop(0,'#102050');grd.addColorStop(1,'#020510');ctx.fillStyle=grd;ctx.fillRect(0,0,400,650);ctx.fillStyle='rgba(255,255,255,0.4)';for(let i=0;i<40;i++){ctx.beginPath();ctx.arc((Math.sin(i*1.7+t)*200+200),(Math.cos(i*2.3+t*0.3)*200+280),Math.random()*1.5,0,6.28);ctx.fill();}ctx.save();ctx.translate(200,270);ctx.save();ctx.rotate(t*1.2);ctx.strokeStyle=mode=='freeze'?'#aaffff':'rgba(0,220,255,0.8)';ctx.lineWidth=mode=='freeze'?4:2;ctx.shadowBlur=15;ctx.shadowColor='#00ddff';ctx.beginPath();ctx.arc(0,0,95,0,6.28);ctx.stroke();ctx.beginPath();ctx.arc(0,0,108,0,6.28);ctx.stroke();ctx.restore();ctx.save();ctx.rotate(t*-1.5);ctx.strokeStyle=mode=='freeze'?'#ffe88a':'rgba(255,180,0,0.8)';ctx.lineWidth=mode=='freeze'?4:2.5;ctx.shadowBlur=20;ctx.shadowColor='#ffaa00';ctx.beginPath();ctx.arc(0,0,115,0,6.28);ctx.stroke();ctx.beginPath();ctx.arc(0,0,128,0,6.28);ctx.stroke();ctx.restore();ctx.save();ctx.rotate(t*0.4);ctx.strokeStyle='#ffd700';ctx.lineWidth=2.5;ctx.shadowBlur=35;ctx.shadowColor='#ffd700';ctx.beginPath();ctx.moveTo(0,-75);ctx.lineTo(-65,38);ctx.lineTo(65,38);ctx.closePath();ctx.stroke();ctx.rotate(Math.PI);ctx.beginPath();ctx.moveTo(0,-75);ctx.lineTo(-65,38);ctx.lineTo(65,38);ctx.closePath();ctx.stroke();ctx.restore();ctx.save();ctx.rotate(Math.sin(t*0.8)*0.2);for(let i=-60;i<60;i+=8){let y=i,off=Math.sin(y*0.1+t*2)*18;ctx.fillStyle=i%16==0?'#00ccff':'#ffd700';ctx.beginPath();ctx.arc(off,y,3.5,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(-off,y,3.5,0,6.28);ctx.fill();if(i%16==0){ctx.strokeStyle='rgba(255,215,0,0.5)';ctx.beginPath();ctx.moveTo(off,y);ctx.lineTo(-off,y);ctx.stroke();}}ctx.restore();ctx.restore();requestAnimationFrame(draw);}draw();</script></body></html>
