<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MERKABA v4 INFO TELEPORT</title><style>@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap');body{margin:0;background:#020510;color:#fff;font-family:'Orbitron',Arial;overflow:hidden;height:100vh;display:flex;flex-direction:column}.top{padding:8px 12px;display:flex;justify-content:space-between;background:#001a33;border-bottom:2px solid #00e5ff;font-size:12px}#game{flex:1;position:relative;background:radial-gradient(#0a1635,#020510)}canvas{width:100%;height:100%;display:block}.hud{position:absolute;bottom:0;left:0;right:0;padding:8px;background:linear-gradient(0deg,rgba(0,0,0,0.95),transparent)}.stats{display:flex;gap:6px;margin-bottom:8px}.stat{flex:1;background:rgba(0,40,80,0.7);border:1px solid #00e5ff;border-radius:8px;padding:6px;text-align:center;font-size:10px}.stat b{font-size:16px;display:block}.btns{display:flex;gap:6px;flex-wrap:wrap}.btn{flex:1;min-width:90px;padding:10px 4px;border-radius:12px;border:2px solid;font-family:'Orbitron',Arial;font-size:8px;font-weight:900;cursor:pointer}.b1{border-color:#00aaff;color:#88ddff;background:rgba(0,100,200,0.3)}.b2{border-color:#ffd700;color:#ffef88;background:rgba(255,200,0,0.15)}.b3{border-color:#ff8800;color:#ffbb66;background:rgba(255,100,0,0.25)}.b4{border-color:#00ff88;color:#88ffaa;background:rgba(0,255,100,0.25);animation:pulse 1s infinite}@keyframes pulse{0%,100%{box-shadow:0 0 15px #0f8}50%{box-shadow:0 0 30px #0f8}}.modal{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,20,40,0.95);border:2px solid #00ff88;border-radius:16px;padding:16px;width:85%;max-width:320px;display:none;z-index:10}.mono{font-family:'Share Tech Mono',monospace;font-size:9px;background:#000;padding:8px;border-radius:6px;word-break:break-all;max-height:120px;overflow:auto;color:#0f0;border:1px solid #0a0;white-space:pre-wrap}.note{font-size:9px;color:#ffef88;margin:8px 0;line-height:1.5}</style></head><body><div class="top"><b>◆ MERKABA v4 INFO TELEPORT</b><div id="adminBadge">VERIFICANDO</div></div><div id="game"><canvas id="c" width="400" height="600"></canvas><div class="hud"><div id="log" style="font-size:9px;color:#7effd1;text-align:center;margin-bottom:6px;font-family:'Share Tech Mono',monospace">ORIGEN: Célula PHERSAA • Animación de transmisión de datos</div><div class="stats"><div class="stat"><span>ORIGEN</span><b id="o">100%</b></div><div class="stat"><span>TÚNEL</span><b id="t">—</b></div><div class="stat"><span>DESTINO</span><b id="d">0%</b></div></div><div class="btns"><button class="btn b1" onclick="setMode('fast')">HORARIO</button><button class="btn b2" onclick="setMode('freeze')">FREEZE</button><button class="btn b3" onclick="setMode('rewind')">REWIND</button><button class="btn b4" onclick="teleportInfo()">TELEPORTAR INFO</button></div></div><div class="modal" id="modal"><h3>INFO TRANSMITIDA</h3><div class="note">Archivo de EJEMPLO con secuencia de relleno. No es ADN real ni tiene uso médico.</div><div class="mono" id="fasta">>PHERSAA</div><div style="display:flex;gap:6px;margin-top:10px"><button class="btn b4" style="flex:1" onclick="downloadFasta()">DESCARGAR EJEMPLO</button><button class="btn b1" style="flex:1" onclick="closeModal()">CERRAR</button></div></div></div><script>
let isAdmin=false;
(function(){let c=localStorage.getItem('phersaa_admin');if(c==='true'){isAdmin=true;document.getElementById('adminBadge').innerText='ADMIN PHERSAA';}else{let p=prompt('CODIGO ADMIN:');if(p==='PHERSAA2026'){isAdmin=true;localStorage.setItem('phersaa_admin','true');document.getElementById('adminBadge').innerText='ADMIN PHERSAA';}else{document.getElementById('adminBadge').innerText='VISITANTE';}}})();
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let time=0,mode='fusion',teleporting=false,progress=0;
function setMode(m){mode=m;document.getElementById('log').innerText='MODO: '+m.toUpperCase();}
function teleportInfo(){if(!isAdmin){alert('Solo ADMIN puede transmitir info');return;}if(teleporting)return;teleporting=true;progress=0;document.getElementById('log').innerText='TRANSMITIENDO...';let int=setInterval(()=>{progress+=2;document.getElementById('o').innerText=(100-progress)+'%';document.getElementById('t').innerText=progress+'%';document.getElementById('d').innerText=progress+'%';document.getElementById('log').innerText='Túnel: '+progress+'% • Transmitiendo...';if(progress>=100){clearInterval(int);document.getElementById('o').innerText='0%';document.getElementById('t').innerText='100%';document.getElementById('d').innerText='100%';document.getElementById('log').innerText='✓ TRANSMISIÓN COMPLETA (animación)';teleporting=false;showModal();}},40);}
function showModal(){document.getElementById('modal').style.display='block';let now=new Date().toISOString();document.getElementById('fasta').innerText='>PHERSAA_EJEMPLO_SIN_ADN_REAL|LEVEL_07|ENERGY_92%|SYNC_87%\nATCGATCGATCGTTAGCTAGCTACGATCGATCGATCGATCGATCG\nGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGCTAGC\n|TIMESTAMP:'+now+'|ADMIN:PHERSAA|STATUS:EJEMPLO|';}
function closeModal(){document.getElementById('modal').style.display='none';}
function downloadFasta(){let t=document.getElementById('fasta').innerText;let b=new Blob([t],{type:'text/plain'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='PHERSAA_EJEMPLO_'+Date.now()+'.fasta';a.click();}
const cells=[];for(let i=0;i<9;i++)cells.push({a:i/9*6.28,r:140+(i%3)*34,s:0.5+(i%4)*0.2,sz:9+(i%3)*3,hue:i%2?'#00e5ff':'#ffd700'});
function cell(x,y,sz,rot,col){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.strokeStyle=col;ctx.lineWidth=1.8;ctx.shadowBlur=12;ctx.shadowColor=col;ctx.beginPath();for(let k=0;k<6;k++){let an=k*Math.PI/3;ctx.lineTo(Math.cos(an)*sz,Math.sin(an)*sz)}ctx.closePath();ctx.stroke();ctx.fillStyle=col;ctx.beginPath();ctx.arc(Math.cos(0)*sz*0.35,0,sz*0.25,0,6.28);ctx.fill();ctx.restore()}
function draw(){time+=mode=='fast'?0.08:mode=='rewind'?-0.06:mode=='freeze'?0:0.015;ctx.clearRect(0,0,400,600);let g=ctx.createRadialGradient(200,260,10,200,260,300);g.addColorStop(0,'#102050');g.addColorStop(1,'#020510');ctx.fillStyle=g;ctx.fillRect(0,0,400,600);ctx.save();ctx.translate(200,260);
for(const c of cells){let an=c.a+time*c.s;cell(Math.cos(an)*c.r,Math.sin(an)*c.r*0.8,c.sz,time*3*c.s*(c.r%2?1:-1),c.hue)}
if(teleporting){ctx.strokeStyle='rgba(0,255,136,'+(0.5+progress/200)+')';ctx.lineWidth=3+progress/20;ctx.shadowBlur=20;ctx.shadowColor='#00ff88';ctx.beginPath();ctx.moveTo(-140,0);ctx.lineTo(140,0);ctx.stroke();for(let i=0;i<5;i++){let x=-140+(progress/100)*280+Math.sin(time*5+i)*10;ctx.fillStyle='#88ffaa';ctx.beginPath();ctx.arc(x,Math.sin(time*3+i)*15,4,0,6.28);ctx.fill();}}
ctx.save();ctx.rotate(time*1.2);ctx.strokeStyle='#00e5ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,85,0,6.28);ctx.stroke();ctx.restore();
ctx.save();ctx.rotate(time*-1.5);ctx.strokeStyle='#ffaa00';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,105,0,6.28);ctx.stroke();ctx.restore();
ctx.save();ctx.rotate(time*0.4);ctx.strokeStyle='#ffd700';ctx.lineWidth=2.5;ctx.shadowBlur=25;ctx.shadowColor='#ffd700';ctx.beginPath();ctx.moveTo(0,-60);ctx.lineTo(-52,30);ctx.lineTo(52,30);ctx.closePath();ctx.stroke();ctx.rotate(Math.PI);ctx.beginPath();ctx.moveTo(0,-60);ctx.lineTo(-52,30);ctx.lineTo(52,30);ctx.closePath();ctx.stroke();ctx.restore();
ctx.restore();requestAnimationFrame(draw);}draw();
</script></body></html>
